<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Κυνήγι Θησαυρού</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    #game {
      width: 100vw;
      height: 100vh;
      background: #222;
      position: relative;
      touch-action: none;
    }

    #coords {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 1.2rem;
      font-family: sans-serif;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="game">
    <div id="coords">x: 0, y: 0</div>
  </div>

  <script>
    const coordsEl = document.getElementById("coords");
    document.getElementById("game").addEventListener("touchstart", (e) => {
    const x = Math.round(e.touches[0].clientX);
    const y = Math.round(e.touches[0].clientY);
    coordsEl.textContent = "x: " + x + ", y: " + y;
    document.getElementById("game").addEventListener("touchmove", (e) => {
    const x = Math.round(e.touches[0].clientX);
    const y = Math.round(e.touches[0].clientY);
    coordsEl.textContent = "x: " + x + ", y: " + y;
});
});
  </script>

</body>
</html>
